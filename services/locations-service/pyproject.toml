[project]
name = "locations-service"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "trashapp-shared",
    "httpx>=0.27.0",
]

[tool.uv.sources]
trashapp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/locations_service"]
