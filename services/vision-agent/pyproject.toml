[project]
name = "vision-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "trashapp-shared",
]

[tool.uv.sources]
trashapp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vision_agent"]
