[project]
name = "insight-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "trashapp-shared",
    "crewai>=0.80.0",
]

[tool.uv.sources]
trashapp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/insight_agent"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

