[project]
name = "chat-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "trashapp-shared",
    "crewai[litellm]>=0.80.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
trashapp-shared = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chat_agent"]
