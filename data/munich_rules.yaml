  - name: LED lamps
    bin: Wertstoffhof
    deposit: none
    alternatives:
      - Giftmobil für kleine Mengen
      - Wertstoffmobil für kleine Mengen, falls verfügbar
      - Handel-Rücknahme, falls angeboten
    notes:
      - LED-Lampen enthalten elektronische Bauteile und dürfen nicht in die Restmülltonne.
      - AWM nimmt bis zu 50 LED-Lampen an Wertstoffhöfen und bis zu 5 am Giftmobil oder Wertstoffmobil an.
      - LED-Lampen nicht in Glascontainer.
    keywords:
