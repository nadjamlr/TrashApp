    source_url: https://www.awm-muenchen.de/abfall-entsorgen/abfalllexikon/detailansicht-lexikoneintrag/altkleider-schuhe-textilien

  - name: Bulky waste
    bin: Wertstoffhof
    deposit: none
    alternatives:
      - Sperrmüllabholung
      - Brauchbare Möbel und Haushaltsgegenstände spenden, verkaufen, reparieren oder wiederverwenden
    notes:
      - Sperrmüll sind Haushaltsgegenstände, die auch nach zumutbarer Demontage nicht in eine 80-Liter-Restmülltonne passen.
      - Beispiele: Möbel, Lampen, Herde, Waschmaschinen, Geschirrspüler, Nähmaschinen, Matratzen, Teppiche und Sportgeräte.
      - Laut AWM sind ca. 2 Kubikmeter pro Tag an Wertstoffhöfen erlaubt; größere Mengen können am Wertstoffhof Plus kostenpflichtig sein.
    keywords:
      - Sperrmuell
