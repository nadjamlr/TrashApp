  - name: Paint, wall paint, and varnish
    bin: Wertstoffhof
    deposit: Manche Naturfarben-Anbieter bieten Mehrwegbehälter mit Pfand an.
    alternatives:
      - Restmülltonne für getrocknete Reste bis 2 kg
      - Wertstoffhof Plus für Mengen über 25 kg, kostenpflichtig
    notes:
      - Privathaushalte können bis zu 25 kg kostenlos an Wertstoffhöfen abgeben.
      - Getrocknete Farbreste bis 2 kg dürfen in die Restmülltonne.
      - Brauchbare Farbe richtig lagern, um Verderb zu vermeiden; erst wiederverwenden, dann entsorgen.
