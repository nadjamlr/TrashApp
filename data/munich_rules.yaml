  - name: Rechargeable batteries and lithium batteries
    bin: Wertstoffhof
    deposit: none
    alternatives:
      - Handel-Rückgabestellen
      - Giftmobil
      - Wertstoffmobil für kleine Mengen, falls verfügbar
    notes:
      - Wenn möglich, Akkus aus defekten Elektrogeräten vor der Entsorgung entnehmen.
      - Lithium-Akku-Pole vor der Entsorgung mit Klebeband isolieren oder in die Originalverpackung legen – Brandgefahr.
      - Defekte Lithium-Akkus sind ein Brandrisiko und müssen sorgfältig behandelt werden.
    keywords:
