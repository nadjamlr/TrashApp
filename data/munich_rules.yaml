  - name: Chemicals and hazardous problem waste
    bin: Giftmobil
    deposit: none
    alternatives:
      - Wertstoffhof zu Problemabfall-Annahmezeiten
      - Wertstoffhof Plus für größere Mengen, laut AWM-Regeln und kostenpflichtig
    notes:
      - Problemabfall ist auch in kleinen Mengen gefährlich und muss über spezielle Sammelstellen entsorgt werden.
      - Beispiele: Lösungsmittel, Pestizide, Säuren, Laugen, Quecksilber-Thermometer, manche Gaskartuschen und Sprühdosen mit Giftresten.
      - Gefahrstoffe gut verpackt bringen, am besten in Originalgebinden.
