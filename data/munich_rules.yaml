  - name: Large electronic appliances
    bin: Wertstoffhof
    deposit: none
    alternatives:
      - Sperrmüllabholung für geeignete Großgeräte
      - Reparieren, spenden, verkaufen oder weiterverwenden, falls noch funktionsfähig
    notes:
      - Münchner Wertstoffhöfe nehmen Großelektrogeräte in Haushaltsmengen an; laut AWM bis zu zwei Großgeräte pro Anlieferung.
      - Kühl- und Gefriergeräte sind separat limitiert, in der Regel ein Stück pro Anlieferung.
      - Großelektrogeräte dürfen nicht in die Restmülltonne.
