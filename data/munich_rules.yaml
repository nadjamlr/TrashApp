  - name: E-cigarettes and vapes
    bin: Wertstoffhof
    deposit: none
    alternatives:
      - Wertstoffmobil für kleine Mengen, falls verfügbar
      - Handel-Rücknahme bei Elektronikhändlern mit über 400 m² Verkaufsfläche (kein Kaufnachweis nötig)
    notes:
      - E-Zigaretten sind Elektroschrott und dürfen nicht in die Restmülltonne.
      - Sie enthalten Gefahrstoffe: Lithium-Akkus, Quecksilber, Blei und Cadmium.
      - Lithium-Akku-Pole vor der Entsorgung mit Klebeband isolieren – Brandgefahr.
      - Einweg-E-Zigaretten wie Elfbar fallen ebenfalls darunter.
      - Händler mit über 400 m² Verkaufsfläche müssen E-Zigaretten unabhängig vom Kaufort zurücknehmen.
    keywords:
      - E-Zigarette
      - E-Zigaretten
      - Einweg-E-Zigarette
      - Vape
      - Elfbar
      - Puff
      - e-cigarette
      - vape pen
      - disposable vape
    source_url: https://www.awm-muenchen.de/abfall-entsorgen/abfalllexikon/detailansicht-lexikoneintrag/e-zigarette

  - name: Motor oil and lubricating oil
    bin: Rücknahme beim Fachhändler
    deposit: none
    alternatives:
      - Wertstoffhof zu Problemabfall-Annahmezeiten, kostenpflichtig
    notes:
      - Motoröl und Schmieröl müssen getrennt gesammelt werden und dürfen nicht ins Grundwasser gelangen.
      - Händler sind zur Rücknahme von Motoröl verpflichtet; Kaufnachweis kann erforderlich sein.
      - AWM berechnet Gebühren für Altöl-Annahme an Wertstoffhöfen zu Problemabfall-Zeiten.
    keywords:
      - Motoroel
      - Motoröl
      - Altoel
      - Altöl
      - Schmieroel
      - Schmieröl
      - Getriebeoel
      - Getriebeöl
      - motor oil
      - engine oil
      - used oil
      - lubricant
    source_url: https://www.awm-muenchen.de/abfall-entsorgen/abfalllexikon/detailansicht-lexikoneintrag/altoel-schmieroel

deposit_rules:
  deposit_plastic:
    amount: "0.25 EUR"
    applies_to:
      - PET bottles in between 0.1 to 3L with Pfand marking
      - Aluminium cans with Pfand marking
      - Only applies to bottles and cans sold in Germany
  deposit_glass_nonalcoholic:
    amount: "0.15 EUR"
    applies_to:
      - Reusable water and other non-alcoholic glass bottles
  deposit_glass_beer:
    amount: "0.08 EUR"
    applies_to:
      - Reusable beer glass bottles
  deposit_tray:
    amount: "1.50 EUR"
  no_deposit:
    applies_to:
      - Milk and dairy bottles
      - Wine and sparkling wine bottles
      - Juice and nectar bottles
      - Bottles without Pfand symbol
