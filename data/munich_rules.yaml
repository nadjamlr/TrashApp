  - name: Clothing, shoes, and textiles
    bin: AWM Altkleidercontainer
    deposit: none
    materials:
      - Textil
      - Textilien
      - textile
      - Stoff
      - clothing
      - fabric
    alternatives:
      - Wertstoffhof für verpackte, tragbare Kleidung und Schuhe
      - Charity-Sammlungen und Secondhand-Läden
      - Sperrmüllabholung für tragbare Kleidung und Schuhe in Säcken
    notes:
      - Nur gut erhaltene und saubere Textilien in Altkleidercontainer – in Tüten oder Säcken verpackt.
      - Kaputte oder stark verschmutzte Textilien kommen in die Restmülltonne.
      - Laut AWM werden Lumpen, Bettwäsche, Vorhänge und lose Stoffe nicht von der Sperrmüllabholung mitgenommen.
    keywords:
