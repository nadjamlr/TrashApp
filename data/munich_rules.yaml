  - name: Glass packaging
    bin: Wertstoffinseln
    deposit: Pfandflaschen beim Händler oder am Pfandautomaten zurückgeben.
    materials:
      - Glas
      - glass
    alternatives:
      - Pfand- und Mehrwegflaschen über das Pfandsystem zurückgeben.
      - Wertstoffhof nur für besondere Glasartikel laut AWM-Liste.
    notes:
      - Wertstoffinseln für Einwegglasbehälter wie Flaschen und Gläser ohne Pfand.
      - Kein Keramikglas, Fensterglas, Spiegel oder Trinkgläser in den Glascontainer.
      - Einwurfzeiten an Wertstoffinseln beachten: in der Regel Mo–Sa 7:00–19:00 Uhr.
    keywords:
      - Flasche
      - Flaschen
      - Glasflasche
      - Glasflaschen
      - Marmeladenglas
      - Einmachglas
      - Einweckglas
      - Konservenglas
