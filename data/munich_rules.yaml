  - name: Paper and cardboard
    bin: Papiertonne
    deposit: none
    materials:
      - Papier
      - Karton
      - Pappe
      - paper
      - cardboard
    alternatives:
      - Wertstoffhof für größere Mengen Karton und Pappe
      - Sperrmüllabholung für sehr große Kartonmengen
    keywords:
      - Zeitung, Zeitungen, Tageszeitung, Tageszeitungen
      - Zeitschrift, Zeitschriften, Magazin, Magazine
      - Papier, Papiere, Papierblatt, Blatt
      - Karton, Kartons, Kartonage, Kartonagen
      - Pappe, Pappen, Pappkarton, Pappkartons, Pappschachtel
      - Brief, Briefe, Briefumschlag, Umschlag, Umschläge
      - Buch, Bücher, Heft, Hefte, Katalog, Kataloge
      - Papiertüte, Papierbeutel, Papierverpackung, Papierverpackungen
      - Schulheft, Notizbuch, Notizblock
      - newspaper, paper, cardboard, magazine, book, envelope
    notes:
      - Papiertonne für sauberes Papier: Zeitungen, Briefe, Bücher ohne Einband, gefalteter Karton, Papiertüten und Papierverpackungen.
      - Schmutziges Papier, Tapeten, Rückpapier von selbstklebenden Folien und Hygienepapier kommen in die Restmülltonne.
      - Getränkekartons und beschichtete Milchkartons kommen an die Wertstoffinseln, nicht in die Papiertonne.
    source_url: https://www.awm-muenchen.de/abfall-entsorgen/abfalllexikon/detailansicht-lexikoneintrag/papier-kartonagen

  - name: Organic kitchen and garden waste
    bin: Biotonne
    deposit: none
    materials:
