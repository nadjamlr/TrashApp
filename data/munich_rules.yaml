  - name: Car batteries and lead batteries
    bin: Wertstoffhof
    deposit: Händler können ein gesetzliches Batteriepfand erheben oder erstatten – Kaufnachweis erforderlich.
    alternatives:
      - Rückgabe an Fachhändler, die eine gesetzliche Rücknahmepflicht haben.
    notes:
      - Pro Person und Tag können bis zu zwei Autobatterien an Münchner Wertstoffhöfen abgegeben werden.
      - Vorsichtig transportieren, damit keine Batteriesäure ausläuft.
      - Bleiakkus nicht in die Restmülltonne.
    keywords:
      - Autobatterie
      - Autobatterien
      - Bleiakku
      - Bleiakkus
      - Starterbatterie
      - car battery
      - lead battery
      - lead-acid battery
    source_url: https://www.awm-muenchen.de/abfall-entsorgen/abfalllexikon/detailansicht-lexikoneintrag/autobatterien-bleiakku

  - name: Small electronic devices
    bin: Wertstoffhof
    deposit: none
    materials:
      - Elektronik
      - electronic
      - Elektrik
    alternatives:
      - Handel-Rücknahme, wo gesetzlich vorgesehen
      - Wertstoffmobil für kleine Geräte, falls verfügbar
      - Reparieren, spenden, verkaufen oder weiterverwenden, falls noch funktionsfähig
    notes:
      - Elektrische und elektronische Geräte dürfen nicht in die Restmülltonne.
      - Persönliche Daten vor der Abgabe von Handys, Tablets, Laptops oder Speichermedien löschen.
      - Zugängliche Batterien und Akkus vor der Entsorgung entnehmen, wenn das Gerät nicht weiterverwendet wird.
