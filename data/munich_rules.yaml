  - name: Batteries and button cells
    bin: Rückgabeboxen im Handel
    deposit: none
    alternatives:
      - Wertstoffhof
      - Giftmobil
    notes:
      - Batterien nicht in die Natur werfen oder in die Restmülltonne.
      - Geschäfte, die Batterien verkaufen, haben meist Sammelboxen am Eingang.
      - Wenn möglich, auf wiederaufladbare Akkus umsteigen.
    keywords:
      - Batterie
      - Batterien
      - Knopfzelle
      - Knopfzellen
      - AA battery
      - AAA battery
