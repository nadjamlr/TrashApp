  - name: Residual household waste
    bin: Restmuelltonne
    deposit: none
    alternatives:
      - Zuerst Recycling, Biotonne, Papiertonne, Wertstoffinseln, Wertstoffhof oder Giftmobil nutzen, wenn ein eigener Entsorgungsweg vorhanden ist.
    notes:
      - Restmülltonne für Abfälle, die nicht über Münchens getrennte Sammelsysteme recycelt werden können.
      - Beispiele laut AWM: Schmutzpapier, Hygieneartikel, Rückpapier und kontaminierte Kleinabfälle.
      - Batterien, Elektronik, Problemabfälle und recycelbare Verpackungen gehören nicht in die Restmülltonne.
    keywords:
      - Restmuell
      - Restmüll
      - Hausmuell
      - Hausmüll
