      - Bierflasche
      - Saftflasche
      - Sektflasche
      - glass bottle
      - glass jar
      - jam jar
      - wine bottle
      - beer bottle
    source_url: https://www.awm-muenchen.de/abfall-entsorgen/abgabestellen/wertstoffinseln

  - name: Plastic packaging
    bin: Wertstoffinseln
    deposit: Pfand gilt für viele Getränkeflaschen – beim Händler oder am Pfandautomaten zurückgeben.
    materials:
      - Kunststoff
      - Plastik
      - plastic
      - Polymer
    alternatives:
      - Einwegplastik vermeiden und auf Mehrwegverpackungen umsteigen.
      - Wertstoffhof für bestimmte Kunststoff-Nicht-Verpackungen laut AWM.
    notes:
      - Wertstoffinseln für Kunststoffverpackungen: Folien, Tragetaschen, Shampoo-Flaschen, Waschmittelkanister und Joghurtbecher.
      - Verpackungen müssen leer sein; perfektes Ausspülen ist nicht nötig.
      - Kunststoff-Haushaltsartikel ohne Verpackungsfunktion können andere Entsorgungswege haben – Abfall-ABC prüfen.
    keywords:
      - Plastikflasche
      - PET-Flasche
      - plastic bottle
      - Kunststoffverpackung
      - Shampoo bottle
      - detergent container
      - yoghurt cup
      - Verpackungsfolie
    source_url: https://www.awm-muenchen.de/entsorgen/abfall-trennen/verpackungsabfall

  - name: Metal packaging
    bin: Wertstoffinseln
    deposit: Pfand gilt für viele Getränkedosen – beim Händler oder am Pfandautomaten zurückgeben.
    materials:
      - Metall
      - Aluminium
      - metal
      - aluminium
    alternatives:
      - Wertstoffhof für größere Metallgegenstände wie Töpfe, Pfannen oder Werkzeug.
    notes:
      - Wertstoffinseln für Metallverpackungen: Dosen, Aluschalen, Alufolie und Metalldeckel.
      - Leere Sprühdosen ohne Gefahrstoffreste kommen mit den Verpackungen; Dosen mit Gefahrstoffresten kommen zum Sondermüll.
      - Abfall nicht neben den Containern abstellen – das gilt als illegale Entsorgung.
    keywords:
