  - name: Fluorescent tubes and energy-saving lamps
    bin: Wertstoffhof
    deposit: none
    alternatives:
      - Giftmobil für bis zu 5 Stück
      - Wertstoffmobil für bis zu 5 Stück
      - Lightcycle-Sammelstellen
    notes:
      - Leuchtstoffröhren, Neonröhren, UV-Röhren und Energiesparlampen können Quecksilber enthalten.
      - Nicht in Restmülltonne oder Glascontainer entsorgen.
      - AWM nimmt bis zu 50 Stück an Wertstoffhöfen an.
