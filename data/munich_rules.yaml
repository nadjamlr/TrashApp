    alternatives:
      - Wertstoffhof für größere Mengen Baum- und Strauchschnitt
      - Eigenkompostierung, falls geeignet
    notes:
      - In die Biotonne: Obst- und Gemüsereste, gekochte und rohe Speisereste, Brot, Kaffeesatz und -filter, Blumen, kleine Mengen Erde, Laub, Gras und kleine Äste.
      - Plastiktüten und kompostierbare Plastik-Biobeutel dürfen nicht in die Biotonne.
      - Hundekot, Katzenstreu und Kleintier-Einstreu gehören nicht in die Biotonne.
