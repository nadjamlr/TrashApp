  - name: Beverage cartons and composite packaging
    bin: Wertstoffinseln
    deposit: none
    alternatives:
      - Mehrwegalternativen bevorzugen, wo möglich.
    notes:
      - Milchkartons, Getränkekartons und beschichtete Behälter für Sahne oder Joghurt kommen an die Wertstoffinseln.
      - Diese Verbundverpackungen gehören nicht in die Papiertonne.
      - Verpackungen vor der Entsorgung leeren.
    keywords:
