  - name: Cooking oil, cooking fat, and frying fat
    bin: Restmuelltonne
    deposit: none
    alternatives:
      - Biotonne für feste Kochfette und sehr kleine Mengen aufgesaugtes Speiseöl
    notes:
      - Flüssiges Speiseöl vor der Entsorgung in einen Behälter füllen, dann in die Restmülltonne.
      - Speiseöl nicht in den Ausguss, Abfluss oder die Toilette schütten.
      - Kleine Mengen aufgesaugtes Öl und feste Kochfette können laut AWM in die Biotonne.
